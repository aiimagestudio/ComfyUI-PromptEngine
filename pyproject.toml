[project]
name = "comfyui-promptengine"
description = "Dictionary-based prompt composition nodes and dictionary-building tools for ComfyUI."
version = "1.2.5"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]
classifiers = [
    "Operating System :: OS Independent",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[project.urls]
Repository = "https://github.com/aiimagestudio/ComfyUI-PromptEngine"
Documentation = "https://github.com/aiimagestudio/ComfyUI-PromptEngine#readme"
"Bug Tracker" = "https://github.com/aiimagestudio/ComfyUI-PromptEngine/issues"

[tool.comfy]
PublisherId = "aiimagestudio"
DisplayName = "ComfyUI-PromptEngine"
requires-comfyui = ">=1.0.0"
